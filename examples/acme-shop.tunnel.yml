# Example tunnel.yml for a fictional "acme-shop" app with a local Supabase stack.
# Copy it into your project as tunnel.yml. With BURROW_DOMAIN=example.dev this gives:
#   app    -> https://acme-shop.example.dev
#   mail   -> https://mail-acme-shop.example.dev    (Mailpit)
#   studio -> https://studio-acme-shop.example.dev  (Supabase Studio)
project: acme-shop
services:
  - name: app            # "app" is the root service: <project>.<domain>
    url: http://localhost:3100
    paths:               # local Supabase API on the same origin
      - { path: /auth/v1, url: http://localhost:54321 }
      - { path: /rest/v1, url: http://localhost:54321 }
      - { path: /storage/v1, url: http://localhost:54321 }
      - { path: /realtime/v1, url: http://localhost:54321 }
  - name: mail
    url: http://localhost:54324
  - name: studio
    url: http://localhost:54323
